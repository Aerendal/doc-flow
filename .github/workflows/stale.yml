name: "Stale issues"

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Oznacz jako stale po 5 dniach braku aktywności jeśli czeka na dane od użytkownika
          stale-issue-label: "status/stale"
          exempt-issue-labels: "status/accepted,status/in-progress,status/blocked,prio/p0,prio/p1"

          days-before-stale: 5
          days-before-close: 3

          stale-issue-message: >
            Brak odpowiedzi od 5 dni. Jeżeli uzupełnisz wymagane informacje (wersja, OS, kroki reprodukcji),
            chętnie wrócę do oceny. Zamknę ten wątek za 3 dni jeżeli nie będę miał więcej danych.

          close-issue-message: >
            Zamykam z powodu braku danych do weryfikacji. Możesz otworzyć ponownie z wymaganymi informacjami.

          # Pull Requesty - nie dotykaj automatycznie
          days-before-pr-stale: -1
          days-before-pr-close: -1
