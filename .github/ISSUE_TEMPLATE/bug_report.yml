name: "Bug report"
description: "Report a reproducible problem (crash, incorrect output, broken workflow)."
title: "[BUG]: "
labels: ["type/bug", "status/needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please keep security issues OUT of Issues.
        Security vulnerabilities must be reported via SECURITY.md / GitHub Security Advisory.

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I searched existing issues and this is not a duplicate."
          required: true
        - label: "This is NOT a security vulnerability disclosure."
          required: true
        - label: "I can provide steps to reproduce (or a minimal repro)."
          required: true

  - type: input
    id: version
    attributes:
      label: "doc-flow version"
      description: "Exact version / commit hash (preferred). If unknown, paste output from `doc-flow --version`."
      placeholder: "e.g. v0.3.1 or commit 1a2b3c4"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: "Installation method"
      options:
        - "Prebuilt binary release"
        - "Built from source (Go)"
        - "Docker / container"
        - "Package manager"
        - "Other / unknown"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "OS"
      options:
        - "Linux"
        - "macOS"
        - "Windows"
        - "Other"
    validations:
      required: true

  - type: input
    id: os_details
    attributes:
      label: "OS details"
      description: "Distro/version (Linux), macOS version, Windows build, architecture."
      placeholder: "e.g. Ubuntu 22.04 x86_64"
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: "Go version (if built from source)"
      description: "Paste `go version` output. If not applicable, write 'N/A'."
      placeholder: "go version go1.22.5 linux/amd64"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: "Command that fails"
      description: "Paste the exact command(s) that triggered the issue."
      placeholder: |
        doc-flow <subcommand> --flag1 ... --flag2 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      placeholder: "What actually happened (including error messages)."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "Numbered steps. If possible, provide minimal input data."
      placeholder: |
        1) ...
        2) ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / output"
      description: "Paste relevant logs. Remove secrets/tokens/paths that should stay private."
      render: shell
      placeholder: |
        (paste console output here)
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: "Anything else that might help (workarounds, regression info, related issues)."
    validations:
      required: false
