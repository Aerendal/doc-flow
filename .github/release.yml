changelog:
  categories:
    - title: "Zmiany lamace kompatybilnosc"
      labels:
        - "breaking-change"
    - title: "Nowe funkcjonalności"
      labels:
        - "type/feature"
    - title: "Naprawione błędy"
      labels:
        - "type/bug"
    - title: "Dokumentacja"
      labels:
        - "type/docs"
    - title: "CI i utrzymanie"
      labels:
        - "area/ci"
        - "type/docs"
      exclude-labels:
        - "type/feature"
        - "type/bug"
